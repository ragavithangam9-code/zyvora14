title: "CampusPilot AI — Student Opportunity Assistant"
pitch: "An intelligent agent that routes each student request to the right tool using Strands Decider 2B, then answers with Amazon Bedrock."
features:
  - "natural-language internship and scholarship search"
  - "free and paid learning resource recommendations"
  - "personalised placement preparation roadmaps"
  - "side-by-side opportunity comparison"
  - "tool routing decided by Strands Decider 2B before every LLM turn"
  - "transparent decision panel showing confidence and probabilities"
eager: false
intro: "CampusPilot AI helps college students discover internships, scholarships, and courses. Before each turn, Strands Decider 2B classifies the request and narrows the agent to one relevant tool — then Amazon Bedrock handles the conversation."
intro_normal: "CampusPilot AI runs on Amazon Bedrock AgentCore Runtime. Strands Decider 2B classifies each student request and routes it to the right tool."
turns:
  - say: "Find internships suitable for a second-year CSE student."
    narrate: "A clear opportunity search: the decider should route to search_opportunities with high confidence."
  - say: "Recommend free Java and DSA learning resources."
    narrate: "A learning request: the decider routes to find_learning_resources."
  - say: "Create a 12-week placement preparation plan."
    narrate: "A career planning request: the decider routes to build_career_plan."
  - say: "Compare INT001 and INT002 for me."
    narrate: "A comparison request: the decider routes to compare_opportunities."
  - say: "I need help with something."
    narrate: "An ambiguous request: the decider returns low confidence and the agent asks a clarifying question instead of guessing."
outro: "One forward pass per decision, calibrated confidence the agent can act on, and Amazon Bedrock for the conversation — all in a single student assistant."
